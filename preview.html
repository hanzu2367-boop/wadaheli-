<!DOCTYPE html>
<html lang="en">
<head>

  <title>Music Preview</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #1a1a2e; color: #eee; }
    h1 { text-align: center; color: #f8a0b5; }
    .track { background: #16213e; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .track h3 { margin: 0 0 4px; color: #f8a0b5; }
    .track .filename { font-size: 12px; color: #888; margin-bottom: 8px; }
    audio { width: 100%; }
  </style>
</head>
